<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0e0e12"/>
  <!-- Waveform bars, bottom-aligned at y=27 -->
  <rect x="2"  y="20" width="4" height="7"  rx="2" fill="#c8ff00"/>
  <rect x="8"  y="13" width="4" height="14" rx="2" fill="#c8ff00"/>
  <rect x="14" y="8"  width="4" height="19" rx="2" fill="#c8ff00"/>
  <rect x="20" y="15" width="4" height="12" rx="2" fill="#c8ff00"/>
  <rect x="26" y="19" width="4" height="8"  rx="2" fill="#c8ff00"/>
  <!-- Cut slash -->
  <line x1="2" y1="30" x2="30" y2="2" stroke="#ff3c6e" stroke-width="2.5" stroke-linecap="round"/>
</svg>
